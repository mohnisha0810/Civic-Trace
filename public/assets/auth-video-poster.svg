<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#06131F"/>
  <defs>
    <radialGradient id="space_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E3A47" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#06131F" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#03080E"/>
    </radialGradient>
    <radialGradient id="globe_glow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0891B2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06131F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan_beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="burnt_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E05B2D"/>
      <stop offset="100%" stop-color="#FF8A65"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#space_glow)"/>

  <!-- Telemetry Grid -->
  <g opacity="0.15" stroke="#00F2FE" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120" stroke-dasharray="4 8"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke-dasharray="4 8"/>
    <line x1="0" y1="360" x2="1280" y2="360" stroke-dasharray="4 8"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke-dasharray="4 8"/>
    <line x1="0" y1="600" x2="1280" y2="600" stroke-dasharray="4 8"/>
    
    <line x1="200" y1="0" x2="200" y2="720" stroke-dasharray="4 8"/>
    <line x1="400" y1="0" x2="400" y2="720" stroke-dasharray="4 8"/>
    <line x1="640" y1="0" x2="640" y2="720" stroke-dasharray="4 8"/>
    <line x1="880" y1="0" x2="880" y2="720" stroke-dasharray="4 8"/>
    <line x1="1080" y1="0" x2="1080" y2="720" stroke-dasharray="4 8"/>
  </g>

  <!-- Central Globe Glow -->
  <circle cx="640" cy="360" r="260" fill="url(#globe_glow)"/>
  <circle cx="640" cy="360" r="240" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="640" cy="360" r="200" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1"/>
  <ellipse cx="640" cy="360" rx="240" ry="90" stroke="#00F2FE" stroke-opacity="0.25" stroke-width="1"/>
  <ellipse cx="640" cy="360" rx="140" ry="240" stroke="#00F2FE" stroke-opacity="0.2" stroke-width="1"/>

  <!-- India Target Node -->
  <circle cx="680" cy="320" r="6" fill="#E05B2D"/>
  <circle cx="680" cy="320" r="14" stroke="#E05B2D" stroke-width="1.5" stroke-opacity="0.8">
    <animate attributeName="r" values="6;24;6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Telemetry HUD Card -->
  <rect x="520" y="470" width="240" height="60" rx="12" fill="#06131F" fill-opacity="0.8" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1"/>
  <text x="640" y="495" fill="#22D3EE" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">GEO-SPATIAL TELEMETRY</text>
  <text x="640" y="515" fill="#E2E8F0" font-family="monospace" font-size="10" text-anchor="middle">COORD: 28.6139° N, 77.2090° E</text>

  <!-- Title / Branding -->
  <text x="640" y="180" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="36" font-weight="900" letter-spacing="0.5" text-anchor="middle">
    CIVIC<tspan fill="#E05B2D">TRACE</tspan>
  </text>
  <text x="640" y="210" fill="#22D3EE" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle">
    EVERY ISSUE TRACKED. EVERY RESOLUTION VERIFIED.
  </text>
</svg>
